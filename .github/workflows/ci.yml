name: Lantern CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Unsigned archive for sideloading/testing (no signing identity on CI).
      # --no-codesign builds the .xcarchive but skips the IPA export, so we
      # package the .app into an IPA manually (installable via sideloading
      # tools; for App Store / TestFlight add certs + provisioning via secrets).
      - run: flutter build ipa --release --no-codesign
      - name: Package unsigned IPA from xcarchive
        run: |
          APP_PATH=$(echo build/ios/archive/Runner.xcarchive/Products/Applications/*.app | head -n 1)
          echo "App: $APP_PATH"
          rm -rf Payload unsigned-ipa && mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # strip any ad-hoc signature remnants so sideloaders can re-sign cleanly
          codesign --remove-signature Payload/*.app 2>/dev/null || true
          zip -r -y unsigned-ipa/Lantern-unsigned.ipa Payload
          ls -la unsigned-ipa/
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-ipa-unsigned
          path: unsigned-ipa/Lantern-unsigned.ipa
