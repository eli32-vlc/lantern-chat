name: Lantern CI

on:
  push:
    branches: [main, beta]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Unsigned archive for sideloading/testing (no signing identity on CI).
      # --no-codesign builds the .xcarchive but skips the IPA export, so we
      # package the .app into an IPA manually (installable via sideloading
      # tools; for App Store / TestFlight add certs + provisioning via secrets).
      - run: flutter build ipa --release --no-codesign
      - name: Package unsigned IPA from xcarchive
        run: |
          set -x
          ls build/ios/archive/Runner.xcarchive/Products/Applications/ || true
          shopt -s nullglob
          apps=(build/ios/archive/Runner.xcarchive/Products/Applications/*.app)
          echo "found ${#apps[@]} app(s)"
          if [ ${#apps[@]} -eq 0 ]; then echo "no .app found"; exit 1; fi
          APP_PATH="${apps[0]}"
          echo "App: $APP_PATH"
          rm -rf Payload unsigned-ipa && mkdir -p Payload unsigned-ipa
          cp -R "$APP_PATH" Payload/
          # strip any ad-hoc signature remnants so sideloaders can re-sign cleanly
          if [ -d "Payload/$(basename "$APP_PATH")" ]; then
            codesign --remove-signature "Payload/$(basename "$APP_PATH")" || true
          fi
          (cd . && zip -r -y unsigned-ipa/Lantern-unsigned.ipa Payload)
          ls -la unsigned-ipa/
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-ipa-unsigned
          path: unsigned-ipa/Lantern-unsigned.ipa

  build-macos:
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter config --enable-macos-desktop
      - run: flutter build macos --release
      - name: Zip macOS app
        run: |
          set -x
          APP_PATH="build/macos/Build/Products/Release/Lantern Chat.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Looking for .app..."
            find build/macos -name '*.app' -type d
            APP_PATH=$(find build/macos -name '*.app' -type d | head -1)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then echo "no .app found"; exit 1; fi
          echo "App: $APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" lantern-macos.zip
          ls -la lantern-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lantern-macos
          path: lantern-macos.zip
